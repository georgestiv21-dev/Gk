<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="115" ry="115" fill="url(#bg-gradient)" />
  
  <!-- Subtle inner glow / border -->
  <rect width="504" height="504" x="4" y="4" rx="111" ry="111" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.1" />

  <!-- GC Text -->
  <text 
    x="50%" 
    y="55%" 
    font-family="system-ui, -apple-system, sans-serif" 
    font-size="280" 
    font-weight="900" 
    letter-spacing="-10"
    fill="#ffffff" 
    text-anchor="middle" 
    dominant-baseline="middle"
    filter="url(#drop-shadow)"
  >
    GC
  </text>
  
  <!-- Cartoon Play Button Accent -->
  <path d="M 220 380 L 320 380 L 270 450 Z" fill="#ffffff" opacity="0.9" />
</svg>
